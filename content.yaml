profile:
  name: "Sung-Hwan Lee (이성환)"
  image: "/profile.png"
  image_alt: "Sung-Hwan Lee"
  # (md)
  intro: >
    I am an ML compiler engineer at [Rebellions](https://rebellions.ai/),
    where I design and build compilers for Rebellions AI chips.
    I received my Ph.D. in Computer Science and Engineering from Seoul National University,
    advised by [Prof. Chung-Kil Hur](https://sf.snu.ac.kr/gil.hur/).
    My research focused on building formal foundations for
    writing, compiling, and verifying concurrent software under weak consistency.
  email: "sunghwan.lee [at] rebellions.ai"
  links:
    - name: "cv"
      url: "/cv.pdf"
    - name: "google scholar"
      url: "https://scholar.google.com/citations?user=TRaVY9IAAAAJ&hl=en"
    - name: "dblp"
      url: "https://dblp.org/pid/86/4776-1.html"
    - name: "github"
      url: "https://github.com/sunghwanl"

